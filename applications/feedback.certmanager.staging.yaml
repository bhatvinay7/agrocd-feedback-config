apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: feedback
spec:
  project: Kafka-cluster
  source:
    repoURL: https://github.com/bhatvinay7/feedback.git
    targetRevision: staging
    path:  Helm/chart.staging/certmanager
    directory:
      recurse: true    
  destination:
    server: https://kubernetes.default.svc
    namespace: feedback-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true      