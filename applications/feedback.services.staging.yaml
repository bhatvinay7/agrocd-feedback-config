apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feedback-services
  namespace: agro-feedback-services
spec:
  project: feedback-services
  source:
    repoURL: https://github.com/bhatvinay7/feedback.git 
    targetRevision: staging
    path: Helm/chart.prod/services
    directory:
      recurse: true    
  destination:
    server: https://kubernetes.default.svc
    namespace: feedback-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  createNamespace: true
  