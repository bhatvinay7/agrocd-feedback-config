apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac
  namespace: feedback
spec:
  project: rbac
  source:
    repoURL: https://github.com/bhatvinay7/feedback.git
    targetRevision: staging
    path:  Helm/chart.staging/rbac
    directory:
      recurse: true    
  destination:
      server: https://kubernetes.default.svc
      namespace: feedback
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true       