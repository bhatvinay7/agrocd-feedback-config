apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-kafka
  namespace: argocd
spec:
  project: sealed-secrets-kafka
  source:
    repoURL: https://github.com/bhatvinay7/feedback.git 
    targetRevision: staging
    path: Helm/chart.staging/kafka-cluster/secrets
  destination:
      server: https://kubernetes.default.svc
      namespace: kafka
