apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sealed-secrets-kafka
  namespace: argocd
spec:
  description: secrets for kafka-cluster
  sourceRepos:
    - https://github.com/bhatvinay7/feedback.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kafka
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
